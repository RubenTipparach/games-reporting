# fly.toml app configuration file generated for games-reporting on 2026-09-09T18:47:02Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'games-reporting'
primary_region = 'ord'

[build]

[env]
  DATA_DIR = '/data'
  PORT = '8080'
  RETENTION_DAYS = '90'

[[mounts]]
  source = 'reports_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
