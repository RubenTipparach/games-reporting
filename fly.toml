# Fly app for the games reporting API.
#
# Rename `app` to whatever `fly launch` gives you, or run
# `fly apps create games-reporting` first and leave it.
app = "games-reporting"
primary_region = "ord"

[build]

[env]
  DATA_DIR = "/data"
  PORT = "8080"
  RETENTION_DAYS = "90"

# SQLite lives on this volume. Create it once, in the same region as the app:
#   fly volumes create reports_data --region ord --size 1
#
# One machine, deliberately. SQLite is a file on one volume and two machines
# cannot both hold it, so the count is pinned here rather than left to scale
# on its own and corrupt the database the first time it does.
[[mounts]]
  source = "reports_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Reports arrive in ones and twos and the rest of the day is silence, so the
  # machine sleeps and wakes on a request. A cold start costs the player
  # nothing: the game posts in the background and does not wait on the answer.
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Zero, not one: with a volume the machine's data survives the stop, so there
  # is no reason to pay for it to idle.
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
