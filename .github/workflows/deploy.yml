name: Deploy

# Deploy on commit to main, which is the whole arrangement: merging is
# releasing. There is no separate "publish" button, because this is a crash
# collector rather than a game build - the worst a bad deploy does is drop
# reports for a minute, and the volume keeps everything already collected.
#
# The Fly half follows the pattern high-frontier-fan-game already uses, for the
# reasons written on each step: a readiness gate that SKIPS rather than fails
# before bootstrap, an idempotent volume-and-single-machine ensure, and a
# deploy that retries the transient network faults Fly's remote builder throws.
#
# Needs one repository secret:
#   FLY_API_TOKEN   from `fly tokens create deploy -a games-reporting`
on:
  push:
    branches: [main]
    # Nothing here changes what runs, so do not spend a deploy on it.
    paths-ignore:
      - "README.md"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      smoke_test:
        description: "Also post test reports at the live service (they stay in the database)"
        type: boolean
        default: false

# NO workflow-level concurrency. A workflow-level group cancelling in progress
# would kill a Fly deploy mid-release, and one that queues at workflow level
# holds up the tests as well. Concurrency belongs per job, and the Fly one
# never cancels: two overlapping `fly deploy` runs against a single machine on
# a single volume is how a service ends up half migrated.

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm test

  deploy:
    name: Deploy to Fly
    needs: test
    runs-on: ubuntu-latest
    # Case-insensitive repo gate, so a fork with no Fly access falls through
    # cleanly instead of failing on a token it was never going to have.
    if: ${{ contains(fromJSON('["rubentipparach/games-reporting", "RubenTipparach/games-reporting"]'), github.repository) }}
    concurrency:
      group: fly-reporting
      cancel-in-progress: false
    outputs:
      ready: ${{ steps.fly_gate.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Three stages, all treated as "skip, do not fail": token missing, token
      # rejected, app not created yet. None of those is a broken commit, and
      # failing the run on them turns every fork and every pre-bootstrap push
      # into a red tick that means nothing. A real deploy failure after the
      # gate still fails the job, which is the distinction worth keeping.
      #
      # `secrets` is not readable from a job-level `if`, which is the other
      # reason this is a step rather than a condition on the job.
      - name: Check Fly readiness
        id: fly_gate
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "${FLY_API_TOKEN}" ]; then
            echo "::notice::FLY_API_TOKEN not set in repository secrets; skipping the deploy. Create one with 'fly tokens create deploy -a games-reporting'."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! flyctl auth whoami > /dev/null 2>&1; then
            echo "::notice::FLY_API_TOKEN is set but Fly rejected it; skipping the deploy. Regenerate with 'fly tokens create deploy -a games-reporting'."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! flyctl status -a games-reporting > /dev/null 2>&1; then
            echo "::notice::Fly app 'games-reporting' not found; skipping the deploy. Bootstrap with 'fly apps create games-reporting'."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      # SQLite is one file with one writer, so this app is exactly one machine
      # on exactly one volume (see fly.toml and src/db.js). Fly will happily
      # leave a second machine behind after a failed release, and a second
      # machine here does not mean "more capacity", it means two databases that
      # each hold half the reports. Both halves of this are no-ops once the
      # desired state holds, so it runs every deploy rather than being
      # something somebody has to remember once.
      - name: Ensure the volume, and exactly one machine
        if: steps.fly_gate.outputs.ready == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APP: games-reporting
          REGION: ord
          VOLUME: reports_data
        run: |
          set -e
          echo "--- volumes before ---"
          flyctl volumes list -a "$APP"
          COUNT=$(flyctl volumes list -a "$APP" --json \
            | jq '[.[] | select(.name=="'"$VOLUME"'" and .region=="'"$REGION"'")] | length')
          if [ "${COUNT:-0}" -lt 1 ]; then
            echo "creating volume $VOLUME in $REGION"
            flyctl volumes create "$VOLUME" --size 1 --region "$REGION" --app "$APP" --yes
          else
            echo "volume $VOLUME already exists in $REGION"
          fi

          echo "--- machines before ---"
          flyctl machine list -a "$APP"
          flyctl machine list -a "$APP" --json > /tmp/machines.json
          IDS=$(jq -r '.[] | select((.config.metadata.fly_process_group // "app") == "app") | .id' /tmp/machines.json)
          KEPT=""
          for M in $IDS; do
            if [ -z "$KEPT" ]; then
              KEPT="$M"
              echo "keeping app machine $M"
              continue
            fi
            echo "destroying extra app machine $M (a second writer on this database)"
            flyctl machine stop "$M" --app "$APP" || true
            flyctl machine destroy "$M" --app "$APP" --force || true
          done

      # An app with no allocated IP has a hostname that resolves nowhere, while
      # every other part of a deploy still reports success. That is what the
      # first two runs of this workflow hit: the deploy said "Visit your newly
      # deployed app at https://games-reporting.fly.dev/" and every request to
      # it returned curl 000, because `fly apps create` does not allocate one.
      #
      # Both of these are free (a SHARED v4, not a dedicated one) and both are
      # no-ops once they exist.
      - name: Make sure the app has an address
        if: steps.fly_gate.outputs.ready == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if flyctl ips list -a games-reporting | grep -qE '\bv6\b'; then
            echo "v6 already allocated"
          else
            echo "allocating v6"
            flyctl ips allocate-v6 -a games-reporting
          fi
          if flyctl ips list -a games-reporting | grep -qE '\bv4\b'; then
            echo "v4 already allocated"
          else
            echo "allocating a shared v4 (free; a dedicated one is not)"
            flyctl ips allocate-v4 --shared -a games-reporting
          fi
          flyctl ips list -a games-reporting

      # Staged so the released image boots with them rather than bouncing the
      # machine a second time to pick them up. Each is only touched when the
      # Actions secret is set, so an unset one is a no-op and a value set by
      # hand with `fly secrets set` is never clobbered.
      #
      # INGEST_KEY is the one that closes posting, and it is deliberately empty
      # for now (see src/config.js): setting it in repository secrets is all it
      # takes to lock the API down, with no code change and no redeploy of a
      # different image. ID_SALT pins the player pseudonymisation salt so it
      # survives the volume being recreated; ADMIN_KEY closes the portal and
      # every read and delete route.
      #
      # BOTH KEYS SHIP UNSET, and that is the whole lockdown switch: putting a
      # value in either repository secret closes that half on the next deploy,
      # with no code change. That is what "easy to turn on later" is buying,
      # and it is why these are staged here rather than being something to
      # remember to run by hand.
      - name: Stage secrets to Fly
        if: steps.fly_gate.outputs.ready == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          INGEST_KEY: ${{ secrets.INGEST_KEY }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          ID_SALT: ${{ secrets.ID_SALT }}
          APP: games-reporting
        run: |
          set -e
          stage_secret() {
            name="$1"; val="$2"
            if [ -n "$val" ]; then
              echo "staging $name"
              flyctl secrets set "$name=$val" --app "$APP" --stage
            else
              echo "::notice::$name not set in Actions secrets; leaving the Fly value untouched."
            fi
          }
          stage_secret INGEST_KEY "${INGEST_KEY}"
          stage_secret ADMIN_KEY  "${ADMIN_KEY}"
          stage_secret ID_SALT    "${ID_SALT}"

          # Names and digests only; `fly secrets list` never prints a value.
          # Worth having in the log because a secret set by hand months ago is
          # otherwise invisible, and one of them decides whether the portal
          # opens.
          echo "--- secrets this app holds ---"
          flyctl secrets list --app "$APP" || true

      # Fly's remote builder and API drop connections transiently, which makes
      # `flyctl deploy` fail in a few seconds before any build output at all.
      # Retry with exponential backoff, the same doctrine this project already
      # applies to git push and fetch. A genuine failure still fails the job
      # after the last attempt.
      - name: Deploy
        if: steps.fly_gate.outputs.ready == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -e
          for attempt in 1 2 3 4; do
            echo "::group::flyctl deploy (attempt ${attempt}/4)"
            if flyctl deploy --remote-only; then
              echo "::endgroup::"
              echo "deploy succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "::endgroup::"
            if [ "${attempt}" -lt 4 ]; then
              backoff=$((attempt * attempt * 10))
              echo "::warning::flyctl deploy failed (attempt ${attempt}/4); retrying in ${backoff}s"
              sleep "${backoff}"
            fi
          done
          echo "::error::flyctl deploy failed after 4 attempts"
          exit 1

      # A machine that crash-looped to its max restart count stays stopped even
      # once a good image is deployed over it, so a deploy that fixes the crash
      # still leaves the app down. That has happened here twice: once on a bad
      # startup guard, once on a schema mismatch against an older volume.
      # Nudging it is harmless when it is already healthy and is the difference
      # between fixed and fixed-but-still-dead when it is not.
      - name: Start the machines
        if: steps.fly_gate.outputs.ready == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl machine start -a games-reporting || true

  smoke:
    name: Smoke test the live service
    needs: deploy
    # Nothing was deployed when the gate skipped, so there is nothing to smoke.
    if: needs.deploy.outputs.ready == 'true'
    runs-on: ubuntu-latest
    env:
      URL: ${{ vars.SERVICE_URL || 'https://games-reporting.fly.dev' }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: superfly/flyctl-actions/setup-flyctl@master

      # The deploy job allocates these; this is the independent check that it
      # actually happened, because an unrouted app fails in a way that looks
      # exactly like a crashed one and the two want different fixes.
      - name: The app has an address to be reached at
        run: |
          flyctl ips list -a games-reporting | tee /tmp/ips.txt
          grep -qE '\bv4\b|\bv6\b' /tmp/ips.txt || {
            echo
            echo "STILL NO IP after the deploy job tried to allocate one."
            exit 1
          }

      # The machine sleeps when idle and wakes on a request, so the first call
      # after a deploy is slow. Polling rather than sleeping a fixed guess, but
      # bounded: about ninety seconds, after which something is wrong and the
      # diagnostics below are more use than more waiting.
      - name: Wait for the service to answer
        run: |
          for i in $(seq 1 18); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 10 "$URL/healthz" || true)
            if [ "$code" = "200" ]; then
              echo "healthy after ${i} attempt(s): $(cat /tmp/health.json)"
              exit 0
            fi
            echo "attempt ${i}: HTTP ${code}"
            sleep 5
          done
          echo "service never answered 200 on /healthz"
          exit 1

      # Only when the wait above failed. This is the step that turns "it did
      # not come up" into a reason, and it has earned its keep twice: it is
      # what found the crash-looping startup guard and the missing IP, and
      # then the schema mismatch against the existing volume.
      - name: Why it did not come up
        if: failure()
        run: |
          echo "===== fly status ====="
          flyctl status -a games-reporting || true
          echo "===== ips ====="
          flyctl ips list -a games-reporting || true
          echo "===== volumes (the mount must exist, in this app's region) ====="
          flyctl volumes list -a games-reporting || true
          echo "===== machine logs ====="
          flyctl logs -a games-reporting --no-tail || true

      # OPT-IN, and off by default, because this posts into the real database
      # and nothing takes it back out. It ran on every push for nine deploys
      # and left thirty six reports behind in three sessions that had never
      # been played: no length, no runs, no mode, and a fault count that was
      # really a count of how many times this workflow had run. A permanent
      # fixture in the data that describes CI rather than the game is worse
      # than not having the check, because the sessions list is read to answer
      # "how are playtests going" and those rows answer nothing.
      #
      # What is kept is everything above and below this step, which is the
      # part that was actually load-bearing: the service answers, it has an
      # address, and its read routes are open. Those prove the deploy without
      # writing anything. Posting is still one manual run away when the
      # ingest path itself is what you want to exercise:
      #
      #   gh workflow run Deploy -f smoke_test=true
      #
      # and `node scripts/send-test-reports.mjs <url>` locally, where a
      # throwaway database is the point rather than the problem.
      - name: Send test reports
        if: github.event_name == 'workflow_dispatch' && inputs.smoke_test
        run: node scripts/send-test-reports.mjs "$URL" "$INGEST_KEY"
        env:
          # Empty until posting is locked down, and the script sends no header
          # when it is empty, which is exactly what an open service wants.
          INGEST_KEY: ${{ secrets.INGEST_KEY }}

      # Not just "the portal is served" - that was true the whole time it was
      # asking for a key nobody had. What is checked is that the READ ROUTES
      # answer without one, because that is what "let me view the data" means
      # and it is the half a page render cannot prove.
      - name: The portal is open, and its data with it
        run: |
          code=$(curl -s -o /tmp/admin.html -w '%{http_code}' --max-time 20 "$URL/")
          test "$code" = "200" || { echo "portal returned $code"; exit 1; }

          code=$(curl -s -o /tmp/sig.json -w '%{http_code}' --max-time 20 "$URL/v1/signatures")
          if [ "$code" = "401" ]; then
            echo
            echo "The read routes are gated, so ADMIN_KEY is set as a Fly secret."
            echo "That is the lockdown flag in its ON position. To open the portal:"
            echo "    fly secrets unset ADMIN_KEY -a games-reporting"
            echo "and clear the ADMIN_KEY repository secret so the deploy stops staging it."
            exit 1
          fi
          test "$code" = "200" || { echo "/v1/signatures returned $code"; cat /tmp/sig.json; exit 1; }
          echo "issues readable with no key: $(cat /tmp/sig.json | head -c 400)"

          # Deleting is behind the same flag, so it is open too. Proved with an
          # id that does not exist: an open route answers 404 for a missing
          # report, a closed one answers 401 before it ever looks. Nothing is
          # destroyed either way, which is why the check uses a zero uuid.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            -X DELETE "$URL/v1/reports/00000000-0000-0000-0000-000000000000")
          test "$code" = "404" || { echo "DELETE answered $code, expected 404"; exit 1; }
          echo "and deleting is reachable without a key, as the flag says"
